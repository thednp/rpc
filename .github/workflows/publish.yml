name: Publish to npm & jsr

on:
  workflow_dispatch:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For checkout
      id-token: write # OIDC Trusted Publisher (npm) + JSR publishing.

    environment: Publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PNPM setup
        uses: pnpm/action-setup@v6

      - name: Node.js Setup
        uses: actions/setup-node@v7
        with:
          node-version: 24 # Or 'lts/*'
          # registry-url http/https is required so npm resolves the public
          # registry default; OIDC supplies the credential (no _authToken).
          registry-url: https://registry.npmjs.org/

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install

      # npm trusted publishing requires npm >= 11.5.1; Node 24's bundled npm
      # is usually fine, but pin latest like the reference demo does.
      - name: Update npm to latest
        run: npm i -g npm@latest

      # Release script: version guard → build → npm publish (vite-style plain
      # OIDC, no --provenance; retried with auth-type=legacy, then raw-PUT
      # break-glass) → jsr.
      - name: Release
        run: node scripts/release.js
        env:
          NPM_CONFIG_LOGLEVEL: notice

      - name: "Diagnostic: npm debug log (403 body)"
        if: failure()
        continue-on-error: true
        run: |
          LOG=$(ls -1t /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | head -1)
          echo "===== npm debug: $LOG (npm $(npm -v)) ====="
          [ -n "$LOG" ] && grep -aiE 'oidc|token|PUT |fetch (GET|POST|PUT)|visibility|proven|403|authori|deni|E403|error' "$LOG" | tail -n 120