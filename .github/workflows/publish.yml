name: Publish to npm & jsr

on:
  workflow_dispatch:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For checkout
      id-token: write # The OIDC ID token is used for authentication with JSR / npm trusted publishing.

    environment: Publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # - name: PNPM setup
      #   uses: pnpm/action-setup@v3

      - name: Node.js Setup
        uses: actions/setup-node@v6
        with:
          node-version: 24 # Or 'lts/*'
          # registry-url: https://registry.npmjs.org/ # Optional if using trusted publishing

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # - name: Disallow installation scripts
      #   run: yq '.allowBuilds[]=false' -i pnpm-workspace.yaml

      - name: Install dependencies
        # run: pnpm i --no-frozen-lockfile
        run: npm install

      # - name: Test
      #   run: npm run test

      # npm's trusted publishing requires npm >= 11.5.1 (staged: >= 11.15).
      # Node 24's bundled npm may be older, so pin latest like the reference
      # demo (github.com/npm-pub-2025/oidc-trusted-publisher) does.
      # - name: Update npm to latest
      #   run: npm i -g npm@latest

      # Stage the release for human approval instead of publishing directly.
      # `npm stage publish` needs no 2FA and uses the OIDC Trusted Publisher
      # (no long-lived token); the CLI framing that trigged the masked 403 on
      # `npm publish` is avoided entirely. A maintainer approves the staged
      # version with 2FA on npmjs.com (Staged Packages tab) or via
      # `npm stage approve <version>`.
      - name: Publish to npm
        id: stage
        run: |
          set -eu
          V=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$V" version --json 2>/dev/null | grep -q "\"$V\""; then
            echo "::notice::$NAME@$V already published on npm; skipping"
          else
            env -u NODE_AUTH_TOKEN npm login --auth-type=oidc
            env -u NODE_AUTH_TOKEN npm publish
          fi

        env:
          NPM_CONFIG_LOGLEVEL: notice

      - name: Publish to jsr
        run: |
          set -eu
          V=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # skip if the exact version is already published on jsr
          SCOPE=$(echo "$NAME" | sed 's|^@||; s|/.*||')
          PKG=$(echo "$NAME" | sed 's|^@[^/]*/||')
          if curl -fsS "https://jsr.io/@$SCOPE/$PKG/meta.json" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.versions[process.argv[1]]?'yes':'no')})" "$V" | grep -q '^yes$'; then
            echo "::notice::$NAME@$V already published on jsr; skipping"
            exit 0
          fi
          deno publish