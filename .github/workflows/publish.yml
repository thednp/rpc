name: Publish to npm

on:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Or 'lts/*'
          registry-url: "https://registry.npmjs.org" # Optional if using trusted publishing

      - name: PNPM setup
        uses: pnpm/action-setup@v3

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # - name: Build (if needed)
      #   run: pnpm build # Later

      - name: Test
        run: pnpm test

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm --registry=https://registry.npmjs.org whoami || true

      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}