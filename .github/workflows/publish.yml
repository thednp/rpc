name: Publish to npm

on:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # For checkout
      id-token: write # The OIDC ID token is used for authentication with JSR.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24 # Or 'lts/*'
          registry-url: "https://registry.npmjs.org" # Optional if using trusted publishing

      - name: Setup npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            npm config set registry https://registry.npmjs.org/
            npm --registry=https://registry.npmjs.org whoami || true
          else
            echo "NODE_AUTH_TOKEN not set; skipping auth"
          fi

      - name: PNPM setup
        uses: pnpm/action-setup@v6

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # - name: Build (if needed)
      #   run: pnpm build # Later

      - name: Test
        run: pnpm test

      # - name: Publish to jsr
      #   run: deno publish

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose
        # run: pnpm publish --provenance --no-git-checks --access public
        run: |
          set -euo pipefail
          pnpm config set git-checks false
          pnpm publish --no-git-checks --access public

      - name: Cleanup npm auth
        if: always()
        run: rm -f ~/.npmrc || true