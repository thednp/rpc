name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For checkout
      id-token: write # The OIDC ID token is used for authentication with JSR / npm trusted publishing.

    environment: Publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PNPM setup
        uses: pnpm/action-setup@v3

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Or 'lts/*'
          # registry-url: https://registry.npmjs.org/ # Optional if using trusted publishing

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # - name: Disallow installation scripts
      #   run: yq '.allowBuilds[]=false' -i pnpm-workspace.yaml

      - name: Install dependencies
        # run: pnpm i --no-frozen-lockfile
        run: pnpm ci

      - name: Test
        run: pnpm test

      # Attempt the canonical `npm publish` first. Its masked 403 (if any)
      # surfaces in the verbose log; if it fails, the raw PUT below publishes.
      - name: Publish to npm
        id: publish
        continue-on-error: true # fall back to raw publish below on failure
        run: |
          set -eu
          V=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # skip if the exact version is already on the registry
          if npm view "$NAME@$V" version --json 2>/dev/null | grep -q "\"$V\""; then
            echo "::notice::$NAME@$V already published on npm; skipping CLI publish"
          else
            npm publish --access public --provenance=false
          fi
        env:
          NPM_CONFIG_LOGLEVEL: verbose

      # Capture the exact request bytes the npm CLI sends during a masked 403.
      # Injects an in-process recorder via NODE_OPTIONS; no MITM/proxy needed.
      # The PUT will 403 again, so nothing is published; results land in the
      # "Analyze CLI 403 dump" step for later investigation.
      - name: Capture CLI 403 (diagnostic)
        id: capture
        if: steps.publish.outcome == 'failure'
        continue-on-error: true
        run: |
          set -eu
          cp scripts/npm-request-recorder.js /tmp/npm-request-recorder.js
          rm -f /tmp/npm-req-dump.log /tmp/npm-req-recorder-ok
          set +e
          NODE_OPTIONS="--import /tmp/npm-request-recorder.js" \
            npm publish --access public --provenance=false \
            --loglevel http 2>/tmp/npm-capture-err.log
          CODE=$?
          set -e
          echo "capture_exit=$CODE"
          echo "--- recorded requests ---"
          node - <<'NODE'
            const fs = require('fs');
            const p = '/tmp/npm-req-dump.log';
            if (fs.existsSync(p)) {
              for (const line of fs.readFileSync(p, 'utf8').trim().split('\n')) {
                const e = JSON.parse(line);
                if (e.kind === 'request') {
                  console.log('REQUEST', e.method, e.url);
                  console.log('headers:', JSON.stringify(e.headers, null, 2));
                  console.log('bodyLen:', e.body.length);
                } else {
                  console.log('RESPONSE', e.statusCode, 'body:', String(e.body).slice(0, 500));
                }
              }
            } else {
              console.log('no dump file');
            }
          NODE

      # Raw well-formed publish PUT with the OIDC-minted npm token.
      # Proven to publish (200 {"success":true}) when the CLI PUT 403'd.
      # Only used as a safety net so the release still goes out.
      - name: Publish to npm (raw PUT fallback)
        id: raw
        if: steps.publish.outcome == 'failure'
        run: |
          set -eu
          REG=https://registry.npmjs.org
          echo "::group::Mint GitHub ID token"
          IDURL="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org"
          IDTOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$IDURL" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).value))")
          echo "::endgroup::"

          echo "::group::Exchange for npm token"
          RESP=$(curl -fsS -X POST -H "Authorization: Bearer $IDTOKEN" "$REG/-/npm/v1/oidc/token/exchange/package/@thednp%2frpc" -d "")
          NPMTOK=$(echo "$RESP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).token))")
          echo "::endgroup::"

          echo "::group::npm pack + build publish doc"
          TARBALL=$(npm pack --silent --pack-destination /tmp)
          echo "tarball=$TARBALL"
          REG="$REG" TARBALL="$TARBALL" node <<'NODE'
            const fs = require('fs');
            const crypto = require('crypto');
            const REG = process.env.REG;
            const tb = process.env.TARBALL;
            const buf = fs.readFileSync('/tmp/' + tb);
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const V = pkg.version;
            const name = pkg.name;
            const tarballUrl = `${REG}/${name}/-/${tb}`;
            const manifest = {
              ...pkg,
              _id: `${name}@${V}`,
              _nodeVersion: process.version,
              _npmVersion: '11.16.0',
              dist: {
                integrity: 'sha512-' + crypto.createHash('sha512').update(buf).digest('base64'),
                shasum: crypto.createHash('sha1').update(buf).digest('hex'),
                tarball: tarballUrl,
              },
            };
            const body = {
              _id: name,
              name,
              description: pkg.description || '',
              'dist-tags': { latest: V },
              versions: { [V]: manifest },
              access: 'public',
              _attachments: {
                [tb]: { content_type: 'application/octet-stream', data: buf.toString('base64') },
              },
            };
            fs.writeFileSync('/tmp/pubdoc.json', JSON.stringify(body));
          NODE
          echo "::endgroup::"

          echo "::group::Raw PUT (well-formed publish doc)"
          CODE=$(curl -sS -D /tmp/hdr -o /tmp/body -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $NPMTOK" \
            -H "Content-Type: application/json" \
            --data-binary "@/tmp/pubdoc.json" \
            "$REG/@thednp%2frpc")
          cat /tmp/hdr
          echo "--- response body ---"
          cat /tmp/body
          echo
          echo "status_code=$CODE"
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::Raw publish rejected with HTTP $CODE"
            exit 1
          fi
          echo "raw publish OK"
          echo "::endgroup::"

      - name: Publish to jsr
        run: deno publish --allow-slow-types