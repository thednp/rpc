name: Publish to npm

on:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # For checkout
      id-token: write # The OIDC ID token is used for authentication with JSR.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24 # Or 'lts/*'
          registry-url: "https://registry.npmjs.org" # Optional if using trusted publishing

      - name: PNPM setup
        uses: pnpm/action-setup@v4

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # - name: Build (if needed)
      #   run: pnpm build # Later

      - name: Test
        run: pnpm test

      # - name: Publish to jsr
      #   run: deno publish

      - name: Diagnose npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e "console.log(process.env.NODE_AUTH_TOKEN ? 'NODE_AUTH_TOKEN=SET' : 'NODE_AUTH_TOKEN=NOT_SET')"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "Registry: $(npm config get registry)"
          npm --registry=https://registry.npmjs.org whoami
          npm config list

      - name: Publish to npm
        run: npm publish --provenance --access public --no-git-checks
        # run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
