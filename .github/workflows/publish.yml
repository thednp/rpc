name: Publish to npm

on:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # For checkout
      id-token: write # The OIDC ID token is used for authentication with JSR.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24 # Or 'lts/*'
          registry-url: "https://registry.npmjs.org" # Optional if using trusted publishing

      - name: PNPM setup
        uses: pnpm/action-setup@v6

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # - name: Build (if needed)
      #   run: pnpm build # Later

      - name: Test
        run: pnpm test

      # - name: Publish to jsr
      #   run: deno publish

      - name: Diagnose npm identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e "console.log(process.env.NODE_AUTH_TOKEN ? 'NODE_AUTH_TOKEN=SET' : 'NODE_AUTH_TOKEN=NOT_SET')"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "Registry: $(npm config get registry)"
          npm --registry=https://registry.npmjs.org whoami || true
          npm --registry=https://registry.npmjs.org access ls-collaborators @thednp/rpc || true
          npm --registry=https://registry.npmjs.org view @thednp/rpc versions --json || true

      - name: Publish to npm (with debug dump on failure)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if pnpm publish --access public --no-git-checks; then
            echo "publish succeeded"
          else
            echo "Publish failed — dumping npm debug logs:"
            ls -la /home/runner/.npm/_logs || true
            for f in /home/runner/.npm/_logs/*-debug-*.log; do
              echo "=== $f ==="
              sed -n '1,400p' "$f" || true
            done
            exit 1
          fi