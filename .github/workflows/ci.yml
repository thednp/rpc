name: CI & Test

on:
  push:
    branches:
      - master
    paths:
      - src/*
      - tests/*
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/ci.yml

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Test on Node

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: PNPM setup
        uses: pnpm/action-setup@v6

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Node Setup
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # run: pnpm install
        run: pnpm install --no-frozen-lockfile

      # - name: Install doc dependencies
      #   run: cd demo && pnpm install --no-frozen-lockfile

      - name: Make sure it is formatted
        run: pnpm format:check

      - name: Typecheck & ESLint
        run: pnpm lint

      # Required, not optional: `tests/adapter-exports.test.ts` is a
      # build-output test that parses the emitted `dist/<adapter>/*.d.mts`.
      # `dist/` is committed, so without this step the suite silently
      # validates the *last committed* bundle instead of the current source,
      # and a type export removed or renamed in `src/` goes unnoticed.
      - name: Build
        run: pnpm build

      - name: Run Unit Tests
        run: pnpm test


      - name: Audit dependencies
        run: pnpm audit:src

      - name: Upload coverage report to coveralls.io...
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}          
